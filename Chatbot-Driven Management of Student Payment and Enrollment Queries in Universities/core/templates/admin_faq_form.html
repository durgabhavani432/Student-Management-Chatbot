{% extends 'base.html' %}
{% block title %}{{ action }} FAQ{% endblock %}
{% block body %}
<div class="admin-layout">
    {% include 'admin_sidebar.html' %}
    <main class="admin-main">
        <div class="page-header">
            <a href="{% url 'admin_faqs' %}" style="color:#4f46e5; font-size:.85rem; text-decoration:none;">
                <i class="fa fa-arrow-left"></i> Back to FAQs
            </a>
            <h1 style="margin-top:8px;">{% if action == 'Add' %}➕ Add New FAQ{% else %}✏️ Edit FAQ{% endif %}</h1>
        </div>

        <div class="card" style="max-width:700px;">
            {% if error %}<div style="background:#fef2f2; color:#ef4444; padding:12px 16px; border-radius:8px; margin-bottom:18px; border:1px solid #fecaca; font-size:.88rem;">{{ error }}</div>{% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>Intent / Topic <span style="color:#94a3b8; font-weight:400;">(used by the chatbot for matching)</span></label>
                    <input type="text" name="intent" value="{{ faq.intent|default:'' }}" placeholder="e.g. tuition_fees" required>
                </div>
                <div class="form-group">
                    <label>Question</label>
                    <input type="text" name="question" value="{{ faq.question|default:'' }}" placeholder="e.g. What are the tuition fees?" required>
                </div>
                <div class="form-group">
                    <label>Custom Keywords <span style="color:#94a3b8; font-weight:400;">(comma-separated, optional)</span></label>
                    <input type="text" name="keywords" value="{{ faq.keywords|default:'' }}" placeholder="e.g. hello, greetings, bot">
                </div>
                <div class="form-group">
                    <label>Answer</label>
                    <textarea name="answer" rows="5" placeholder="Enter the bot's reply…" required style="resize:vertical;">{{ faq.answer|default:'' }}</textarea>
                </div>
                <div style="display:flex; gap:12px; margin-top:8px;">
                    <button type="submit" class="btn btn-indigo"><i class="fa fa-save"></i> {{ action }} FAQ</button>
                    <a href="{% url 'admin_faqs' %}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>
{% endblock %}
