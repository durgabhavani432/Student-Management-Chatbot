{% extends 'base.html' %}
{% block title %}Delete Account{% endblock %}
{% block content %}
<div class="auth-bg">
    <div class="auth-card" style="max-width:420px;">
        <div style="text-align:center; font-size:3rem; margin-bottom:10px;">⚠️</div>
        <h2 style="color:#ef4444; text-align:center;">Delete Account</h2>
        <p style="text-align:center; color:#64748b; font-size:.9rem; margin-bottom:24px;">
            This action is <strong>permanent</strong>. Your account and all chat history will be deleted.
        </p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" style="width:100%; padding:13px; border:none; border-radius:10px; background:#ef4444; color:white; font-size:1rem; font-weight:600; cursor:pointer; margin-bottom:12px;">
                Yes, Delete My Account
            </button>
        </form>
        <a href="{% url 'chatbot' %}" style="display:block; text-align:center; color:#4f46e5; font-size:.9rem; font-weight:600;">
            ← Cancel, go back
        </a>
    </div>
</div>
{% endblock %}
