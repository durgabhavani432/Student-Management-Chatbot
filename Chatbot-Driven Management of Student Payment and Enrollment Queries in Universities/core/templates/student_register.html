{% extends 'base.html' %}
{% block title %}Student Registration{% endblock %}
{% block content %}
<div class="auth-bg">
    <div class="auth-card">
        <div style="text-align:center; margin-bottom:8px; font-size:2.5rem;">📝</div>
        <h2 style="text-align:center;">Create Account</h2>
        <p class="sub" style="text-align:center;">Register to access the university chatbot system.</p>

        {% if error %}<div class="error-msg"><i class="fa fa-circle-exclamation"></i> {{ error }}</div>{% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="e.g. John Smith" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="student@university.edu" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Min. 8 characters" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Re-enter password" required>
            </div>
            <button class="btn-primary" type="submit">Register <i class="fa fa-user-plus"></i></button>
        </form>

        <div class="auth-link">
            Already registered? <a href="{% url 'student_login' %}">Sign in here</a>
        </div>
    </div>
</div>
{% endblock %}
