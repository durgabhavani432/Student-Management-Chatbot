<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}University Chatbot{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --secondary: #9333ea;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --sidebar-bg: #1e293b;
            --sidebar-text: #cbd5e1;
            --sidebar-active: #4f46e5;
            --radius: 12px;
            --shadow: 0 4px 24px rgba(79,70,229,0.10);
        }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        a { text-decoration: none; color: inherit; }

        /* Auth pages wrapper */
        .auth-bg {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            padding: 20px;
        }
        .auth-card {
            background: rgba(255,255,255,0.97);
            border-radius: 24px;
            padding: 44px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(79,70,229,0.25);
        }
        .auth-card h2 { color: var(--primary); font-size: 1.7rem; margin-bottom: 6px; }
        .auth-card p.sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px 16px;
            border: 1.5px solid var(--border); border-radius: 10px;
            font-size: 0.95rem; font-family: inherit; color: var(--text);
            background: #f8fafc; transition: border .2s, box-shadow .2s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.13);
        }
        .btn-primary {
            width: 100%; padding: 13px; border: none; border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; font-size: 1rem; font-weight: 600; cursor: pointer;
            letter-spacing: .3px; transition: opacity .2s, transform .1s;
        }
        .btn-primary:hover { opacity: .92; transform: translateY(-1px); }
        .error-msg { background: #fef2f2; color: var(--danger); padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 0.87rem; border: 1px solid #fecaca; }
        .auth-link { text-align: center; margin-top: 20px; color: var(--muted); font-size: 0.88rem; }
        .auth-link a { color: var(--primary); font-weight: 600; }

        /* Admin layout */
        .admin-layout { display: flex; min-height: 100vh; }
        .admin-sidebar {
            width: 250px; min-width: 250px;
            background: var(--sidebar-bg); color: var(--sidebar-text);
            display: flex; flex-direction: column; padding: 0;
            position: sticky; top: 0; height: 100vh; overflow-y: auto;
        }
        .sidebar-brand {
            padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 1.1rem; font-weight: 700; color: white;
            display: flex; align-items: center; gap: 10px;
        }
        .sidebar-brand i { color: var(--primary); font-size: 1.4rem; }
        .sidebar-nav { padding: 16px 0; flex: 1; }
        .sidebar-nav a {
            display: flex; align-items: center; gap: 12px;
            padding: 11px 20px; color: var(--sidebar-text); font-size: 0.9rem;
            transition: background .15s, color .15s; border-left: 3px solid transparent;
        }
        .sidebar-nav a:hover, .sidebar-nav a.active {
            background: rgba(79,70,229,.18); color: white;
            border-left-color: var(--primary);
        }
        .sidebar-nav a i { width: 20px; text-align: center; }
        .sidebar-footer {
            padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.08);
        }
        .admin-main { flex: 1; padding: 32px; overflow-x: hidden; }
        .page-header { margin-bottom: 28px; }
        .page-header h1 { font-size: 1.6rem; font-weight: 700; color: var(--text); }
        .page-header p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }

        /* Cards */
        .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 28px; }
        .kpi-card { background: var(--card); border-radius: var(--radius); padding: 24px 20px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 18px; }
        .kpi-icon { width: 54px; height: 54px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .kpi-val { font-size: 2rem; font-weight: 700; line-height: 1; }
        .kpi-label { font-size: 0.82rem; color: var(--muted); margin-top: 4px; font-weight: 500; }
        .icon-indigo { background: rgba(79,70,229,.12); color: var(--primary); }
        .icon-green { background: rgba(16,185,129,.12); color: var(--success); }
        .icon-purple { background: rgba(147,51,234,.12); color: var(--secondary); }
        .icon-amber { background: rgba(245,158,11,.12); color: var(--warning); }

        /* Tables */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
        th { font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; background: #f8fafc; font-size: 0.78rem; }
        tr:hover td { background: #f8fafc; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge-green { background: #d1fae5; color: #065f46; }
        .badge-red { background: #fee2e2; color: #991b1b; }
        .badge-blue { background: #dbeafe; color: #1e40af; }
        .badge-amber { background: #fef3c7; color: #92400e; }

        /* Buttons */
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; cursor: pointer; border: none; transition: opacity .2s; }
        .btn:hover { opacity: .85; }
        .btn-sm { padding: 5px 12px; font-size: 0.8rem; border-radius: 6px; }
        .btn-indigo { background: var(--primary); color: white; }
        .btn-red { background: var(--danger); color: white; }
        .btn-green { background: var(--success); color: white; }
        .btn-amber { background: var(--warning); color: white; }
        .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }

        /* Search bar */
        .search-bar { display: flex; gap: 10px; margin-bottom: 18px; }
        .search-bar input { flex: 1; padding: 10px 16px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.9rem; font-family: inherit; }
        .search-bar input:focus { outline: none; border-color: var(--primary); }

        /* Stars */
        .stars { color: var(--warning); letter-spacing: 2px; }

        /* Alerts */
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 0.88rem; }
        .alert-info { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .alert-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }

        /* Responsive */
        @media (max-width: 768px) {
            .admin-sidebar { display: none; }
            .admin-main { padding: 16px; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
{% block body %}
{% block content %}{% endblock %}
{% endblock %}
</body>
</html>
