{% extends 'base.html' %}
{% block title %}Admin Registration{% endblock %}
{% block content %}
<div class="auth-bg">
    <div class="auth-card">
        <div style="text-align:center; margin-bottom:8px; font-size:2.5rem;">🔑</div>
        <h2 style="text-align:center;">Admin Registration</h2>
        <p class="sub" style="text-align:center;">Create a new administrator account.</p>

        {% if error %}<div class="error-msg"><i class="fa fa-circle-exclamation"></i> {{ error }}</div>{% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Choose admin username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter strong password" required>
            </div>
            <button class="btn-primary" type="submit">Create Admin Account</button>
        </form>

        <div class="auth-link">
            Already have an account? <a href="{% url 'admin_login' %}">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
