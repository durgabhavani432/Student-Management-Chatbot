{% extends 'base.html' %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="auth-bg">
    <div class="auth-card">
        <div style="text-align:center; margin-bottom:8px; font-size:2.5rem;">🛡️</div>
        <h2 style="text-align:center;">Admin Login</h2>
        <p class="sub" style="text-align:center;">Secure admin access — authorized personnel only.</p>

        {% if error %}<div class="error-msg"><i class="fa fa-circle-exclamation"></i> {{ error }}</div>{% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Admin Username</label>
                <input type="text" name="username" placeholder="Enter admin username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>
            <button class="btn-primary" type="submit">Access Dashboard <i class="fa fa-arrow-right"></i></button>
        </form>

        <div class="auth-link">
            <a href="{% url 'home' %}" style="color:#9333ea;">← Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
